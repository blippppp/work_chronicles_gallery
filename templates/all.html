<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Comics — Work Chronicles Gallery</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            padding: 20px;
        }

        @media (max-width: 767px) {
            body { padding: 10px; }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            color: #888;
            font-size: 14px;
        }

        .header-nav {
            margin-top: 10px;
        }

        .header-nav a {
            color: #888;
            font-size: 13px;
            text-decoration: none;
            border: 1px solid #333;
            padding: 4px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .header-nav a:hover {
            color: #ccc;
            border-color: #555;
        }

        /* ── Search ─────────────────────────────────────────────────────── */

        .search-wrap {
            position: relative;
            width: min(480px, 90%);
            margin: 0 auto 24px;
        }

        .search-input-row {
            display: flex;
            align-items: center;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 0 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input-row:focus-within {
            border-color: #555;
            box-shadow: 0 0 0 3px rgba(255,255,255,0.04);
        }

        .search-icon {
            color: #555;
            font-size: 15px;
            flex-shrink: 0;
            margin-right: 8px;
            pointer-events: none;
        }

        .search-box {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .search-box::placeholder { color: #555; }

        .search-clear {
            background: none;
            border: none;
            color: #555;
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            display: none;
            flex-shrink: 0;
        }

        .search-clear:hover { color: #aaa; }

        .search-clear.visible { display: block; }

        /* ── Suggestion dropdown ────────────────────────────────────────── */

        .suggest-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #181818;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            z-index: 200;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            display: none;
        }

        .suggest-dropdown.open { display: block; }

        .suggest-header {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px 6px;
            border-bottom: 1px solid #222;
        }

        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 1px solid #2a2a5a;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 10px;
            font-weight: 600;
            color: #7a9fff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .ai-badge-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #7a9fff;
            animation: ai-pulse 2s ease-in-out infinite;
        }

        @keyframes ai-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        .suggest-label {
            font-size: 11px;
            color: #444;
        }

        .suggest-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #1e1e1e;
        }

        .suggest-item:last-child { border-bottom: none; }

        .suggest-item:hover,
        .suggest-item.active {
            background: #222;
        }

        .suggest-thumb {
            width: 48px;
            height: 36px;
            border-radius: 5px;
            object-fit: cover;
            flex-shrink: 0;
            background: #2a2a2a;
        }

        .suggest-text {
            flex: 1;
            min-width: 0;
        }

        .suggest-title {
            font-size: 13px;
            font-weight: 500;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggest-phrase {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggest-phrase em {
            color: #7a9fff;
            font-style: normal;
        }

        .suggest-cat {
            font-size: 10px;
            color: #555;
            background: #222;
            border: 1px solid #2a2a2a;
            border-radius: 3px;
            padding: 1px 5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .suggest-thinking {
            padding: 12px 14px;
            font-size: 12px;
            color: #555;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggest-thinking-dots span {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #555;
            margin: 0 1px;
            animation: dot-bounce 1.2s ease-in-out infinite;
        }

        .suggest-thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .suggest-thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-4px); }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (max-width: 767px) {
            .grid {
                grid-template-columns: repeat(1, 1fr);
                gap: 8px;
            }
        }

        .img-container {
            width: 100%;
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        .img-container .tooltip {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 8px 10px;
            font-size: 13px;
            text-align: center;
            border-radius: 0 0 8px 8px;
            pointer-events: none;
        }

        .img-container:hover .tooltip,
        .img-container:active .tooltip {
            display: block;
        }

        .img-container .title-label {
            display: none;
            font-size: 12px;
            color: #aaa;
            text-align: center;
            padding: 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 767px) {
            .img-container .title-label {
                display: block;
            }
            .img-container .tooltip {
                display: none !important;
            }
        }

        .modal {
            display: none;
            position: fixed;
            background: rgba(0,0,0,0.95);
            width: 100%;
            height: 100%;
            top: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal img {
            max-width: 95%;
            max-height: 85vh;
            display: block;
            object-fit: contain;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        @media (max-width: 767px) {
            .nav-btn {
                font-size: 32px;
                padding: 15px;
            }
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        .loader {
            text-align: center;
            padding: 20px;
            color: #aaa;
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .no-results {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Work Chronicles Gallery</h1>
    <p id="subtitle">All {{ total }} comics</p>
    <div class="header-nav">
        <a href="/">&#8592; Browse by category</a>
    </div>
</div>

<!-- Search with AI suggestion dropdown -->
<div class="search-wrap" id="search-wrap">
    <div class="search-input-row">
        <span class="search-icon">&#128269;</span>
        <input
            type="text"
            class="search-box"
            id="search-box"
            placeholder="Search or describe a comic..."
            autocomplete="off"
            aria-label="Search comics"
            oninput="handleSearchInput(this.value)"
            onkeydown="handleSearchKey(event)"
        >
        <button class="search-clear" id="search-clear" onclick="clearSearch()" aria-label="Clear search">&#10005;</button>
    </div>
    <div class="suggest-dropdown" id="suggest-dropdown"></div>
</div>

<div class="grid" id="gallery"></div>
<div class="loader" id="loader">Loading...</div>

<div id="modal" class="modal">
    <span class="nav-btn prev" onclick="prevImage()">&#10094;</span>
    <img id="modal-img" alt="" aria-label="Post image">
    <span class="nav-btn next" onclick="nextImage()">&#10095;</span>
</div>

<script>
const R2_BASE_URL = {{ r2_base_url | tojson }};
const BATCH_SIZE = 40;

let offset = 0;
let loading = false;
let exhausted = false;
let searchMode = false;
let _searchList = null;
let _loadedPosts = [];
let currentIndex = 0;

// ── Suggestion state ──────────────────────────────────────────────────────
let suggestTimer = null;
let suggestAbort = null;
let activeIdx = -1;
let currentSuggestions = [];

// ── Debounce timers ───────────────────────────────────────────────────────
let _searchDebounce = null;

function _activeList() {
    return searchMode && _searchList !== null ? _searchList : _loadedPosts;
}

// ── Rendering ─────────────────────────────────────────────────────────────

function renderImages(posts, append = false) {
    const gallery = document.getElementById("gallery");
    if (!append) {
        gallery.innerHTML = "";
        if (posts.length === 0) {
            gallery.innerHTML = '<div class="no-results">No comics found.</div>';
            return;
        }
    }

    posts.forEach(post => {
        const wrapper = document.createElement("div");
        wrapper.className = "img-container";

        const el = document.createElement("img");
        el.src = R2_BASE_URL + "/" + post.id + "." + (post.ext || "jpg");
        el.loading = "lazy";
        el.alt = post.title;
        el.onclick = () => openModal(post);

        const tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        tooltip.innerText = post.title;

        const label = document.createElement("div");
        label.className = "title-label";
        label.innerText = post.title;

        wrapper.appendChild(el);
        wrapper.appendChild(tooltip);
        wrapper.appendChild(label);
        gallery.appendChild(wrapper);
    });
}

// ── Infinite scroll ───────────────────────────────────────────────────────

async function loadNextBatch() {
    if (loading || exhausted || searchMode) return;
    loading = true;
    showLoader("Loading...");

    try {
        const res = await fetch(`/api/images?offset=${offset}`);
        const batch = await res.json();
        if (batch.length === 0) {
            exhausted = true;
        } else {
            _loadedPosts = _loadedPosts.concat(batch);
            renderImages(batch, /* append= */ true);
            offset += batch.length;
            if (batch.length < BATCH_SIZE) exhausted = true;
        }
    } catch (e) {
        console.error("Load failed:", e);
    }

    hideLoader();
    loading = false;
}

function onScroll() {
    if (searchMode || exhausted || loading) return;
    const scrollBottom = window.scrollY + window.innerHeight;
    const pageHeight = document.documentElement.scrollHeight;
    if (pageHeight - scrollBottom < 400) {
        loadNextBatch();
    }
}

window.addEventListener("scroll", onScroll, { passive: true });

// ── Search ────────────────────────────────────────────────────────────────

function handleSearchInput(query) {
    document.getElementById("search-clear").classList.toggle("visible", query.length > 0);

    // Suggestions: debounce 350ms, min 2 chars
    clearTimeout(suggestTimer);
    if (query.length >= 2) {
        showThinking();
        suggestTimer = setTimeout(() => fetchSuggestions(query), 350);
    } else {
        closeSuggestions();
        // Gallery search: debounce 500ms
        clearTimeout(_searchDebounce);
        _searchDebounce = setTimeout(() => runSearch(query), 500);
    }
}

async function runSearch(query) {
    const subtitle = document.getElementById("subtitle");
    if (!query) {
        searchMode = false;
        _searchList = null;
        const gallery = document.getElementById("gallery");
        gallery.innerHTML = "";
        offset = 0;
        exhausted = false;
        _loadedPosts = [];
        subtitle.textContent = "All {{ total }} comics";
        await loadNextBatch();
        return;
    }

    searchMode = true;
    showLoader("Searching...");

    try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
        const results = await res.json();
        _searchList = results;
        subtitle.textContent = `${results.length} result${results.length !== 1 ? "s" : ""} for "${query}"`;
        renderImages(results, /* append= */ false);
    } catch (e) {
        console.error("Search failed:", e);
    }

    hideLoader();
}

function clearSearch() {
    const box = document.getElementById("search-box");
    box.value = "";
    box.focus();
    document.getElementById("search-clear").classList.remove("visible");
    closeSuggestions();
    clearTimeout(_searchDebounce);
    runSearch("");
}

// ── AI Suggestions ────────────────────────────────────────────────────────

function showThinking() {
    showLoader("AI thinking...");
    activeIdx = -1;
}

async function fetchSuggestions(query) {
    if (suggestAbort) suggestAbort.abort();
    suggestAbort = new AbortController();

    try {
        const res = await fetch(
            `/api/suggest?q=${encodeURIComponent(query)}`,
            { signal: suggestAbort.signal }
        );
        const suggestions = await res.json();
        currentSuggestions = suggestions;
        renderSuggestions(query, suggestions);
    } catch (e) {
        if (e.name !== "AbortError") {
            closeSuggestions();
        }
    }
}

function bestPhrase(suggestion, query) {
    const q = query.toLowerCase();
    const phrases = suggestion.phrases || [];
    if (!phrases.length) return "";
    let best = phrases[0];
    let bestScore = 0;
    for (const p of phrases) {
        const words = q.split(/\s+/);
        const score = words.filter(w => p.toLowerCase().includes(w)).length;
        if (score > bestScore) { bestScore = score; best = p; }
    }
    return best;
}

function highlightMatch(phrase, query) {
    let result = phrase;
    const words = query.trim().split(/\s+/).filter(Boolean);
    for (const word of words) {
        const re = new RegExp(`(${word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
        result = result.replace(re, "<em>$1</em>");
    }
    return result;
}

function renderSuggestions(query, suggestions) {
    if (!suggestions.length) {
        runSearch(query);
        return;
    }
    searchMode = true;
    _searchList = suggestions;
    document.getElementById("subtitle").textContent = `${suggestions.length} AI result${suggestions.length !== 1 ? "s" : ""} for "${query}"`;
    renderImages(suggestions, /* append= */ false);
    hideLoader();
    activeIdx = -1;
}

function closeSuggestions() {
    const dd = document.getElementById("suggest-dropdown");
    dd.classList.remove("open");
    dd.innerHTML = "";
    hideLoader();
    activeIdx = -1;
    currentSuggestions = [];
}

function selectSuggestion(idx) {
    const s = currentSuggestions[idx];
    if (!s) return;
    closeSuggestions();
    openModal(s);
}

function handleSearchKey(e) {
    const items = document.querySelectorAll(".suggest-item");
    if (!items.length) return;

    if (e.key === "ArrowDown") {
        e.preventDefault();
        activeIdx = Math.min(activeIdx + 1, items.length - 1);
        updateActiveItem(items);
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        activeIdx = Math.max(activeIdx - 1, -1);
        updateActiveItem(items);
    } else if (e.key === "Enter" && activeIdx >= 0) {
        e.preventDefault();
        selectSuggestion(activeIdx);
    } else if (e.key === "Escape") {
        closeSuggestions();
    }
}

function updateActiveItem(items) {
    items.forEach((el, i) => el.classList.toggle("active", i === activeIdx));
}

// Close dropdown when clicking outside
document.addEventListener("mousedown", (e) => {
    if (!document.getElementById("search-wrap").contains(e.target)) {
        closeSuggestions();
    }
});

// ── Modal ─────────────────────────────────────────────────────────────────

function openModal(post) {
    const list = _activeList();
    let idx = list.findIndex(p => p.id === post.id);
    if (idx === -1) {
        // Post from suggestion not in current list — show it alone
        _loadedPosts = [post];
        searchMode = false;
        _searchList = null;
        idx = 0;
    }
    currentIndex = idx;
    updateModal();
    document.getElementById("modal").style.display = "flex";
}

function updateModal() {
    const list = _activeList();
    if (list.length === 0) return;
    const post = list[currentIndex];
    const img = document.getElementById("modal-img");
    img.src = R2_BASE_URL + "/" + post.id + "." + (post.ext || "jpg");
    img.alt = post.title;
}

function nextImage() {
    const list = _activeList();
    if (list.length === 0) return;
    currentIndex = (currentIndex + 1) % list.length;
    updateModal();
}

function prevImage() {
    const list = _activeList();
    if (list.length === 0) return;
    currentIndex = (currentIndex - 1 + list.length) % list.length;
    updateModal();
}

document.getElementById("modal").onclick = function(e) {
    if (e.target.id === "modal") this.style.display = "none";
};

document.addEventListener("keydown", (e) => {
    if (document.getElementById("modal").style.display === "flex") {
        if (e.key === "ArrowRight") nextImage();
        if (e.key === "ArrowLeft") prevImage();
        if (e.key === "Escape") {
            document.getElementById("modal").style.display = "none";
            // Return to landing page after closing modal from suggestion
            const searchBox = document.getElementById("search-box");
            if (searchBox && searchBox.value) {
                searchBox.value = "";
                document.getElementById("search-clear").classList.remove("visible");
                closeSuggestions();
                // Reset to show all comics
                const subtitle = document.getElementById("subtitle");
                searchMode = false;
                _searchList = null;
                const gallery = document.getElementById("gallery");
                gallery.innerHTML = "";
                offset = 0;
                exhausted = false;
                _loadedPosts = [];
                subtitle.textContent = "All {{ total }} comics";
                loadNextBatch();
            }
        }
    }
});

// ── Loader / utils ────────────────────────────────────────────────────────

function showLoader(text) {
    const loader = document.getElementById("loader");
    loader.style.display = "block";
    loader.innerText = text;
}

function hideLoader() {
    document.getElementById("loader").style.display = "none";
}

function escapeHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ── Boot ──────────────────────────────────────────────────────────────────
loadNextBatch();
</script>

</body>
</html>
