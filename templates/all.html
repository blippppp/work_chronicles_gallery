<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Comics — Work Chronicles Gallery</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #111;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            padding: 20px;
        }

        @media (max-width: 767px) {
            body { padding: 10px; }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            color: #888;
            font-size: 14px;
        }

        .header-nav {
            margin-top: 10px;
        }

        .header-nav a {
            color: #888;
            font-size: 13px;
            text-decoration: none;
            border: 1px solid #333;
            padding: 4px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .header-nav a:hover {
            color: #ccc;
            border-color: #555;
        }

        .search-box {
            display: block;
            margin: 0 auto 24px;
            padding: 12px 16px;
            width: min(400px, 90%);
            border-radius: 10px;
            border: 1px solid #333;
            background: #1a1a1a;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box:focus {
            border-color: #555;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (max-width: 767px) {
            .grid {
                grid-template-columns: repeat(1, 1fr);
                gap: 8px;
            }
        }

        .img-container {
            width: 100%;
            background: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            position: relative;
        }

        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        .img-container .tooltip {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 8px 10px;
            font-size: 13px;
            text-align: center;
            border-radius: 0 0 8px 8px;
            pointer-events: none;
        }

        .img-container:hover .tooltip,
        .img-container:active .tooltip {
            display: block;
        }

        .img-container .title-label {
            display: none;
            font-size: 12px;
            color: #aaa;
            text-align: center;
            padding: 4px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @media (max-width: 767px) {
            .img-container .title-label {
                display: block;
            }
            .img-container .tooltip {
                display: none !important;
            }
        }

        .modal {
            display: none;
            position: fixed;
            background: rgba(0,0,0,0.95);
            width: 100%;
            height: 100%;
            top: 0;
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal img {
            max-width: 95%;
            max-height: 85vh;
            display: block;
            object-fit: contain;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        @media (max-width: 767px) {
            .nav-btn {
                font-size: 32px;
                padding: 15px;
            }
        }

        .prev { left: 10px; }
        .next { right: 10px; }

        .loader {
            text-align: center;
            padding: 20px;
            color: #aaa;
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        .no-results {
            text-align: center;
            color: #666;
            padding: 40px 20px;
            font-size: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Work Chronicles Gallery</h1>
    <p id="subtitle">All {{ total }} comics</p>
    <div class="header-nav">
        <a href="/">&#8592; Browse by category</a>
    </div>
</div>

<input type="text" class="search-box" placeholder="Search by title..." oninput="handleSearch(this.value)" aria-label="Search by title">

<div class="grid" id="gallery"></div>
<div class="loader" id="loader">Loading...</div>

<div id="modal" class="modal">
    <span class="nav-btn prev" onclick="prevImage()">&#10094;</span>
    <img id="modal-img" alt="" aria-label="Post image">
    <span class="nav-btn next" onclick="nextImage()">&#10095;</span>
</div>

<script>
const R2_BASE_URL = {{ r2_base_url | tojson }};
const BATCH_SIZE = 40;

let offset = 0;
let loading = false;
let exhausted = false;
let searchMode = false;
let debounceTimer;

// In search mode these hold the full search result list and the current index.
let _searchList = null;
// In normal mode the "current list" is everything loaded so far (for modal nav).
let _loadedPosts = [];
// Modal state
let currentIndex = 0;

function _activeList() {
    return searchMode && _searchList !== null ? _searchList : _loadedPosts;
}

// ---- rendering ----

function renderImages(posts, append = false) {
    const gallery = document.getElementById("gallery");
    if (!append) {
        gallery.innerHTML = "";
        if (posts.length === 0) {
            gallery.innerHTML = '<div class="no-results">No comics found.</div>';
            return;
        }
    }

    posts.forEach(post => {
        const wrapper = document.createElement("div");
        wrapper.className = "img-container";

        const el = document.createElement("img");
        el.src = R2_BASE_URL + "/" + post.id + "." + (post.ext || "jpg");
        el.loading = "lazy";
        el.alt = post.title;
        el.onclick = () => openModal(post);

        const tooltip = document.createElement("div");
        tooltip.className = "tooltip";
        tooltip.innerText = post.title;

        const label = document.createElement("div");
        label.className = "title-label";
        label.innerText = post.title;

        wrapper.appendChild(el);
        wrapper.appendChild(tooltip);
        wrapper.appendChild(label);
        gallery.appendChild(wrapper);
    });
}

// ---- infinite scroll ----

async function loadNextBatch() {
    if (loading || exhausted || searchMode) return;
    loading = true;
    showLoader("Loading...");

    try {
        const res = await fetch(`/api/images?offset=${offset}`);
        const batch = await res.json();
        if (batch.length === 0) {
            exhausted = true;
        } else {
            _loadedPosts = _loadedPosts.concat(batch);
            renderImages(batch, /* append= */ true);
            offset += batch.length;
            if (batch.length < BATCH_SIZE) exhausted = true;
        }
    } catch (e) {
        console.error("Load failed:", e);
    }

    hideLoader();
    loading = false;
}

function onScroll() {
    if (searchMode || exhausted || loading) return;
    const scrollBottom = window.scrollY + window.innerHeight;
    const pageHeight = document.documentElement.scrollHeight;
    if (pageHeight - scrollBottom < 400) {
        loadNextBatch();
    }
}

window.addEventListener("scroll", onScroll, { passive: true });

// ---- search ----

function handleSearch(query) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(async () => {
        const subtitle = document.getElementById("subtitle");
        if (!query) {
            // Restore infinite-scroll mode
            searchMode = false;
            _searchList = null;
            const gallery = document.getElementById("gallery");
            gallery.innerHTML = "";
            offset = 0;
            exhausted = false;
            _loadedPosts = [];
            subtitle.textContent = "All {{ total }} comics";
            await loadNextBatch();
            return;
        }

        searchMode = true;
        showLoader("Searching...");

        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
            const results = await res.json();
            _searchList = results;
            subtitle.textContent = `${results.length} result${results.length !== 1 ? "s" : ""} for "${query}"`;
            renderImages(results, /* append= */ false);
        } catch (e) {
            console.error("Search failed:", e);
        }

        hideLoader();
    }, 300);
}

// ---- modal ----

function openModal(post) {
    const list = _activeList();
    const idx = list.findIndex(p => p.id === post.id);
    if (idx === -1 || list.length === 0) return;
    currentIndex = idx;
    updateModal();
    document.getElementById("modal").style.display = "flex";
}

function updateModal() {
    const list = _activeList();
    if (list.length === 0) return;
    const post = list[currentIndex];
    const img = document.getElementById("modal-img");
    img.src = R2_BASE_URL + "/" + post.id + "." + (post.ext || "jpg");
    img.alt = post.title;
}

function nextImage() {
    const list = _activeList();
    if (list.length === 0) return;
    currentIndex = (currentIndex + 1) % list.length;
    updateModal();
}

function prevImage() {
    const list = _activeList();
    if (list.length === 0) return;
    currentIndex = (currentIndex - 1 + list.length) % list.length;
    updateModal();
}

document.getElementById("modal").onclick = function(e) {
    if (e.target.id === "modal") this.style.display = "none";
};

document.addEventListener("keydown", (e) => {
    if (document.getElementById("modal").style.display === "flex") {
        if (e.key === "ArrowRight") nextImage();
        if (e.key === "ArrowLeft") prevImage();
        if (e.key === "Escape") document.getElementById("modal").style.display = "none";
    }
});

function showLoader(text) {
    const loader = document.getElementById("loader");
    loader.style.display = "block";
    loader.innerText = text;
}

function hideLoader() {
    document.getElementById("loader").style.display = "none";
}

// Boot
loadNextBatch();
</script>

</body>
</html>
